apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-api
  labels:
    app: platform-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below 2 healthy pods, never add more than 1 extra at a time
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
      annotations:
        # forces a rollout when only the ConfigMap changes, if you script this in CI
        rollout-trigger: "manual"
    spec:
      # Non-root, matches the Dockerfile's appuser
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: platform-api
          image: <ACR_NAME>.azurecr.io/platform-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: DB_PASSWORD
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Liveness: is the CONTAINER alive? Failure -> restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          # Readiness: should the POD receive traffic? Failure -> removed
          # from Service endpoints, but NOT restarted.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # read-only root FS means the app needs a writable /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
