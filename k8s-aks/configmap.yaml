apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-config
  namespace: platform-api
data:
  SERVICE_NAME: "enterprise-platform-api"
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  REGION: "azure-central-india"
  # Failure-injection switches — flip these to demo incidents without
  # touching code or rebuilding the image.
  CRASH_ON_STARTUP: "false"
  FAILURE_MODE: "false"
  READY_OVERRIDE: "true"
